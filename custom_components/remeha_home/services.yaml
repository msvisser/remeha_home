set_holiday_mode:
  target:
    entity:
      integration: remeha_home
      domain: binary_sensor
  fields:
    start_date:
      required: true
      example: "2026-12-20"
      selector:
        date:
    end_date:
      required: true
      example: "2026-12-27"
      selector:
        date:

cancel_holiday_mode:
  target:
    entity:
      integration: remeha_home
      domain: binary_sensor

get_energy_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: remeha_home
    start_date:
      required: true
      example: "2026-01-01"
      selector:
        date:
    end_date:
      required: true
      example: "2026-01-31"
      selector:
        date:

set_temporary_override:
  target:
    entity:
      integration: remeha_home
      domain: climate
  fields:
    temperature:
      required: true
      example: 21
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      example: "01:30:00"
      selector:
        duration:
